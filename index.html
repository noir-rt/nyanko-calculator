<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>にゃんこ電卓</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🐾 にゃんこ電卓 🐾</h1>

  <div class="calculator">

<div class="cat">
  <div class="cat-ears">
    <span class="cat-ear left-ear"></span>
    <span class="cat-ear right-ear"></span>
  </div>

<div class="cat-face">
  <span class="cat-eye left-eye">
    <span class="eye-highlight"></span>
  </span>

  <span class="cat-eye right-eye">
    <span class="eye-highlight"></span>
  </span>

  <span class="cat-cheek left-cheek"></span>
  <span class="cat-cheek right-cheek"></span>

<span class="cat-nose"></span>

<span class="cat-mouth">ω</span>

<span class="cat-whiskers left-whiskers"></span>
<span class="cat-whiskers right-whiskers"></span>
</div>

  <div class="cat-paws left-paw">🐾</div>
  <div class="cat-paws right-paw">🐾</div>
</div>

<div class="history">
  <p>計算履歴</p>
  <ul id="history-list"></ul>
</div>

<div class="display">
  <div class="expression"></div>
  <div class="result">0</div>
</div>

<div class="button-grid">
  <button class="clear">AC</button>
  <button class="clear">C</button>
  <button class="function">←</button>
  <button class="operator">÷</button>

  <button class="number">7</button>
  <button class="number">8</button>
  <button class="number">9</button>
  <button class="operator">×</button>

  <button class="number">4</button>
  <button class="number">5</button>
  <button class="number">6</button>
  <button class="operator">−</button>

  <button class="number">1</button>
  <button class="number">2</button>
  <button class="number">3</button>
  <button class="operator">＋</button>

  <button class="function">±</button>
  <button class="number">0</button>
  <button class="number">.</button>
  <button class="equals">＝</button>

  <button class="function">%</button>
  <button class="function">√</button>
</div>

  <script src="script.js"></script>

</body>
</html>
